[tool.poetry]
name = "sagebench"
version = "0.1.0"
description = "Simulated Bruker .d fixtures and ground-truth FDR/TPR harness for the Sage database search engine."
authors = ["David Teschner <davidteschner@googlemail.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "sagebench" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
pandas = "^2.2"
numpy = "^1.26"
pyarrow = ">=15.0"
tqdm = "^4.66"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.5"

[tool.poetry.scripts]
sagebench = "sagebench.cli:main"

[build-system]
requires = ["poetry-core>=1.7"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
