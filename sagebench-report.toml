[[runs]]
name     = "HLA 10K G40 (unspecific)"
sage_out = "runs/hla-10k/results.sage.parquet"
truth    = ["data/refs/hla-10k/TIMSIM-DDA-HLA-10K-G40-001/synthetic_data.db"]

[[venns]]
title    = "G30M replicate consistency"
subtitle = "How stable are sage's identifications across simulated replicates?"
runs     = ["HeLa 150K G30M (rep001)", "HeLa 150K G30M (rep002)", "HeLa 150K G30M (rep003)"]

[[venns]]
title    = "Gradient effect (150K HeLa, rep001)"
subtitle = "Do longer gradients add IDs on top, or also swap which peptides win topN?"
runs     = ["HeLa 150K G07M (rep001)", "HeLa 150K G15M (rep001)", "HeLa 150K G30M (rep001)"]

[[venns]]
title    = "Proteome density at fixed gradient (G30M)"
subtitle = "150K vs 300K peptides on the same 30-min gradient — does sage handle the chimeric load?"
runs     = ["HeLa 150K G30M (rep001)", "HeLa 150K G30M (rep002)", "HeLa 300K G30M (rep001)"]

[deep_dive]
# Drives the TDC variant analysis: pick the run whose q-value drift we
# want to dissect, then sweep score (hyperscore vs LDA discriminant) and
# competition method (PSM-level vs peptide double).
run_name = "HeLa 150K G30M (rep001)"
variants = [
    ["hyperscore",              "psm"],
    ["hyperscore",              "peptide_psm_peptide"],
    ["sage_discriminant_score", "psm"],
    ["sage_discriminant_score", "peptide_psm_peptide"],
]
